<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Хроники Эльгоры</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Ruslan+Display&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Жесткий фикс экрана, убираем любые полосы прокрутки у страницы */
        html, body {
            width: 100%;
            height: 100%;
            background: #050508;
            color: #fff;
            overflow: hidden;
            font-family: 'Nunito', sans-serif;
            position: fixed;
            inset: 0;
        }

        /* Главный контейнер игры на весь экран */
        .game-viewport {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background-color: #08090d;
            background-image: url('hero.jpg');
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 12px env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        /* Затемнение для читаемости */
        .game-viewport::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(4, 5, 8, .75) 0%, rgba(4, 5, 8, .85) 50%, rgba(4, 5, 8, .95) 100%);
            pointer-events: none;
            z-index: 1;
        }

        .game-viewport > * {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
        }

        /* Шапка профиля */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: rgba(15, 16, 22, 0.85);
            border: 1px solid rgba(243, 156, 18, 0.35);
            border-radius: 14px;
            backdrop-filter: blur(10px);
        }

        .user-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #f39c12, #d35400);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            text-align: left;
        }

        .user-name {
            font-size: 13px;
            font-weight: 800;
            color: #fff;
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-level {
            font-size: 9px;
            font-weight: 800;
            color: #f5ad35;
            background: rgba(243, 156, 18, 0.15);
            padding: 1px 5px;
            border-radius: 4px;
            width: fit-content;
        }

        .game-gold {
            font-size: 13px;
            font-weight: 800;
            color: #ffc04d;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(243, 156, 18, 0.3);
            padding: 6px 12px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Центральная игровая область */
        .game-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px 10px;
        }

        .screen-title {
            font-family: 'Cinzel', Georgia, serif;
            font-size: 32px;
            font-weight: 700;
            color: #f5a623;
            margin-bottom: 8px;
            text-shadow: 0 3px 10px rgba(0,0,0,0.9);
        }

        .screen-desc {
            font-size: 14px;
            font-weight: 600;
            color: #d0d5dc;
            margin-bottom: 24px;
            max-width: 300px;
            line-height: 1.4;
        }

        .main-btn {
            width: 100%;
            max-width: 260px;
            padding: 15px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #ffb52e 0%, #f39c12 50%, #d35400 100%);
            color: #fff;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(243, 156, 18, 0.4);
            transition: transform 0.1s ease;
        }

        .main-btn:active {
            transform: scale(0.96);
        }

        /* Нижнее меню навигации */
        .game-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            height: 65px;
            background: rgba(12, 13, 18, 0.95);
            border-top: 1px solid rgba(243, 156, 18, 0.25);
            border-radius: 16px 16px 0 0;
            backdrop-filter: blur(10px);
        }

        .nav-tab {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            cursor: pointer;
            color: #7b8591;
            font-size: 9px;
            font-weight: 800;
            transition: color 0.2s;
        }

        .nav-tab.active {
            color: #f39c12;
            background: rgba(243, 156, 18, 0.08);
        }

        .nav-icon {
            font-size: 18px;
        }

        /* Экран загрузки */
        #loader {
            position: absolute;
            inset: 0;
            z-index: 1000;
            background: #050508;
            background-image: url('loading.jpg');
            background-position: center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: opacity 0.4s ease;
        }

        #loader::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(5, 5, 8, 0.85);
            z-index: 1;
        }

        .loader-inner {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 300px;
            text-align: center;
        }

        .loader-title {
            font-family: 'Ruslan Display', Georgia, serif;
            font-size: 42px;
            color: #fff;
            text-transform: uppercase;
            margin-bottom: 40px;
            text-shadow: 0 4px 0 #7a3b00, 0 6px 15px rgba(0,0,0,0.9);
        }

        .progress-track {
            width: 100%;
            height: 10px;
            background: rgba(0,0,0,0.8);
            border: 1px solid rgba(255, 200, 100, 0.4);
            border-radius: 6px;
            padding: 2px;
            margin-bottom: 10px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #b94a00, #f39c12, #ffd76a);
            border-radius: 4px;
            transition: width 0.05s linear;
        }

        .loader-text {
            font-size: 12px;
            font-weight: 700;
            color: #ffe39a;
        }

        .screens-container {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .screens-container.active {
            display: flex;
        }
    </style>
</head>
<body>

    <!-- Экран загрузки -->
    <div id="loader">
        <div class="loader-inner">
            <div class="loader-title">Хроники<br>Эльгоры</div>
            <div class="progress-track">
                <div id="p-bar" class="progress-bar"></div>
            </div>
            <div id="p-text" class="loader-text">Загрузка мира... 0%</div>
        </div>
    </div>

    <!-- Основной игровой интерфейс -->
    <div id="game-app" class="screens-container">
        <div class="game-viewport">
            
            <header class="game-header">
                <div class="user-box">
                    <div class="user-avatar">🛡️</div>
                    <div class="user-info">
                        <span id="u-name" class="user-name">Герой</span>
                        <span class="user-level">Уровень 1</span>
                    </div>
                </div>
                <div class="game-gold">🪙 500</div>
            </header>

            <div class="game-content">
                <h1 id="screen-title" class="screen-title">Герой</h1>
                <p id="screen-desc" class="screen-desc">Твой отряд готов к походу в подземелье и сражениям с монстрами.</p>
                <button class="main-btn" onclick="onActionClick()">В бой</button>
            </div>

            <nav class="game-nav">
                <div class="nav-tab active" onclick="switchTab(this, 'Герой', 'Твой отряд готов к походу в подземелье и сражениям с монстрами.', 'В бой')">
                    <span class="nav-icon">🛡️</span>
                    <span>Герой</span>
                </div>
                <div class="nav-tab" onclick="switchTab(this, 'Город', 'Посети таверну или кузницу для улучшения снаряжения.', 'В таверну')">
                    <span class="nav-icon">🏰</span>
                    <span>Город</span>
                </div>
                <div class="nav-tab" onclick="switchTab(this, 'ПвП Арена', 'Сражайся с другими игроками за славу и сокровища.', 'Найти бой')">
                    <span class="nav-icon">⚔️</span>
                    <span>ПвП</span>
                </div>
                <div class="nav-tab" onclick="switchTab(this, 'Магазин', 'Редкие зелья, свитки и артефакты для отряда.', 'Купить')">
                    <span class="nav-icon">🪙</span>
                    <span>Магазин</span>
                </div>
                <div class="nav-tab" onclick="switchTab(this, 'Друзья', 'Приглашай соратников и получайте бонусы вместе.', 'Пригласить')">
                    <span class="nav-icon">👥</span>
                    <span>Друзья</span>
                </div>
                <div class="nav-tab" onclick="switchTab(this, 'Настройки', 'Управление звуком, музыкой и игровыми данными.', 'Сохранить')">
                    <span class="nav-icon">⚙️</span>
                    <span>Настройки</span>
                </div>
            </nav>

        </div>
    </div>

<script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
        tg.ready();
        tg.expand();
        try {
            tg.setHeaderColor('#050508');
            tg.setBackgroundColor('#050508');
        } catch (e) {}

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const firstName = tg.initDataUnsafe.user.first_name;
            if (firstName) {
                document.getElementById('u-name').textContent = firstName;
            }
        }
    }

    // Имитация плавной загрузки
    let loadProgress = 0;
    const bar = document.getElementById('p-bar');
    const pText = document.getElementById('p-text');
    const loader = document.getElementById('loader');
    const gameApp = document.getElementById('game-app');

    const loadTimer = setInterval(() => {
        loadProgress += Math.floor(Math.random() * 4) + 2;
        if (loadProgress >= 100) {
            loadProgress = 100;
            clearInterval(loadTimer);
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                    gameApp.classList.add('active');
                }, 400);
            }, 200);
        }
        bar.style.width = loadProgress + '%';
        pText.textContent = `Загрузка мира... ${loadProgress}%`;
    }, 30);

    function switchTab(el, title, desc, btnText) {
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');

        document.getElementById('screen-title').textContent = title;
        document.getElementById('screen-desc').textContent = desc;
        document.querySelector('.main-btn').textContent = btnText;

        if (tg && tg.HapticFeedback) {
            tg.HapticFeedback.selectionChanged();
        }
    }

    function onActionClick() {
        if (tg && tg.HapticFeedback) {
            tg.HapticFeedback.impactOccurred('medium');
        }
        if (tg && tg.showAlert) {
            tg.showAlert("Действие выполнено!");
        } else {
            alert("Действие выполнено!");
        }
    }
</script>
</body>
</html>
