<script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
        tg.ready();
        tg.expand();
        try {
            tg.setHeaderColor('#08090d');
            tg.setBackgroundColor('#08090d');
        } catch (e) {}
    }

    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
        const user = tg.initDataUnsafe.user;
        const userName = user.first_name;
        if (userName) {
            document.querySelectorAll('.nickname').forEach(function(el) {
                el.textContent = userName;
            });
        }
    }

    let progress = 0;
    const fill = document.getElementById('progress-fill');
    const statusText = document.getElementById('loading-status');
    const loadingScreen = document.getElementById('loading-screen');
    const navBar = document.getElementById('nav-bar');

    // Запускаем прогресс-бар сразу
    const loadingInterval = setInterval(function() {
        progress += Math.floor(Math.random() * 8) + 3;
        if (progress >= 100) {
            progress = 100;
            clearInterval(loadingInterval);
            finishLoading();
        }
        fill.style.width = progress + '%';
        statusText.textContent = 'Загрузка мира... ' + progress + '%';
    }, 50);

    function finishLoading() {
        setTimeout(function() {
            loadingScreen.style.opacity = '0';
            setTimeout(function() {
                loadingScreen.style.display = 'none';
                navBar.classList.add('visible');
                showScreen('hero');
            }, 500);
        }, 200);
    }

    function showScreen(tabName) {
        document.querySelectorAll('.screen').forEach(function(screen) {
            screen.classList.remove('active');
        });
        const targetScreen = document.getElementById('screen-' + tabName);
        if (targetScreen) {
            targetScreen.classList.add('active');
        }
    }

    function switchTab(tabName, element) {
        document.querySelectorAll('.nav-item').forEach(function(item) {
            item.classList.remove('active');
        });
        element.classList.add('active');
        showScreen(tabName);
    }

    function gameAction(msg) {
        if (tg && tg.HapticFeedback) {
            tg.HapticFeedback.impactOccurred('medium');
        }
        if (tg && tg.showAlert) {
            tg.showAlert(msg);
        } else {
            alert(msg);
        }
    }
</script>
