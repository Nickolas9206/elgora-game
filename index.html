<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Chronicles of Elgora</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: 'Montserrat', sans-serif; }
        body { background-color: #0b0c10; color: #ffffff; height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .main-container { position: relative; width: 100%; max-width: 480px; height: 100%; max-height: 800px; box-shadow: 0 0 20px rgba(0,0,0,0.5); overflow: hidden; }

        /* --- ОБЩИЕ СТИЛИ ЭКРАНОВ --- */
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; transition: opacity 0.5s ease; }
        .bg-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-position: center center; background-size: cover; background-repeat: no-repeat; z-index: 1; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; }
        .content { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column; }

        /* --- 1. ЭКРАН ЗАГРУЗКИ --- */
        #loading-screen { opacity: 1; z-index: 100; background-color: #0b0c10; }
        #loading-bg { background-image: url('https://i.imgur.com/7cM57i8.jpeg'); }
        #loading-screen .overlay { background: linear-gradient(to bottom, rgba(11, 12, 16, 0.5) 0%, rgba(11, 12, 16, 0.8) 70%, rgba(11, 12, 16, 0.95) 100%); }

        .game-title { text-align: center; margin-top: auto; margin-bottom: auto; padding: 0 20px; }
        .game-title h1 { font-family: 'Cinzel Decorative', serif; font-size: 42px; font-weight: 900; background: linear-gradient(180deg, #ffe066 0%, #f39c12 50%, #d35400 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 25px rgba(243, 156, 18, 0.8); line-height: 1.1; letter-spacing: 1px; }
        .game-title p { font-size: 14px; color: #c8d6e5; letter-spacing: 4px; text-transform: uppercase; margin-top: 10px; text-shadow: 0 2px 4px rgba(0,0,0,0.9); font-weight: 600; }

        .loader-area { width: 100%; max-width: 360px; text-align: center; margin: 0 auto 35px auto; padding: 0 20px; }
        .progress-bar-bg { width: 100%; height: 12px; background: rgba(0, 0, 0, 0.6); border: 1px solid #f39c12; border-radius: 8px; overflow: hidden; }
    </style>
</head>
<body>
    <div class="main-container">
        <div id="loading-screen" class="screen">
            <div id="loading-bg" class="bg-image"></div>
            <div class="overlay"></div>
            <div class="content">
                <div class="game-title">
                    <h1>CHRONICLES OF ELGORA</h1>
                    <p>Dungeons & Mercenaries</p>
                </div>
                <div class="loader-area">
                    <div class="progress-bar-bg"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
